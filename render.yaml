services:
  - type: web
    name: svj-joyeria
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_ENGINE
        value: sqlite
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
