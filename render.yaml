services:
  - type: web
    name: svj-joyeria
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_ENGINE
        value: mysql
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Las siguientes variables las agregas manualmente en el dashboard de Render
      # copiando los valores que te da Railway al crear la base de datos MySQL:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
