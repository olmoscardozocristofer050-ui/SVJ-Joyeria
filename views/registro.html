<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Joyería</title>
    <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="/login" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19l-7-7 7-7"/>
                    <path d="M19 12H5"/>
                </svg>
                <b>Volver al inicio</b>
            </a>

            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3h12l4 6-10 13L2 9Z"/>
                    <path d="M11 3 8 9l4 13"/>
                    <path d="M13 3l3 6-4 13"/>
                    <path d="M2 9h20"/>
                </svg>
            </div>

            <h1><b>Crear Cuenta</b></h1>
            <p class="subtitle">Regístrate para comprar en nuestra joyería</p>

            % if error:
            <div style="background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; border: 1px solid rgba(239, 68, 68, 0.3);">
                {{error}}
            </div>
            % end

            <form action="/registro" method="post">
                <label>Nombre completo</label>
                <div class="input-group">
                    <input type="text" name="nombre_completo" placeholder="Tu nombre" required>
                </div>

                <label>Teléfono/Celular</label>
                <div class="input-group">
                    <input type="text" name="telefono" placeholder="+591 ..." required>
                </div>

                <label>Correo electrónico</label>
                <div class="input-group">
                    <input type="email" name="correo" placeholder="tu@email.com" required>
                </div>

                <label>Contraseña</label>
                <div class="input-group">
                    <!-- Su id es "reg-password" -->
                    <input type="password" id="reg-password" name="password" placeholder="••••••••" required>
                    <button type="button" class="eye-icon-btn" onclick="togglePassword('reg-password', this)" title="Mostrar/Ocultar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <label>Confirmar contraseña</label>
                <div class="input-group">
                    <!-- Su id es "reg-confirm" -->
                    <input type="password" id="reg-confirm" name="confirm_password" placeholder="••••••••" required>
                    <button type="button" class="eye-icon-btn" onclick="togglePassword('reg-confirm', this)" title="Mostrar/Ocultar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <button type="submit" class="btn">
                    Crear Cuenta
                </button>
            </form>
        </div>
    </div>

    <script>
        const svgOjo = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`;
        const svgOjoTachado = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;

        function togglePassword(inputId, button)
        {
            const input = document.getElementById(inputId);
            if (input.type === 'password')
            {
                input.type = 'text';
                button.innerHTML = svgOjoTachado;
            } else {
                input.type = 'password';
                button.innerHTML = svgOjo;
            }
        }
    </script>
</body>
</html>
