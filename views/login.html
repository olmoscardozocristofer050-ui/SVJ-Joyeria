<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Joyería</title>
    <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3h12l4 6-10 13L2 9Z"/>
                    <path d="M11 3 8 9l4 13"/>
                    <path d="M13 3l3 6-4 13"/>
                    <path d="M2 9h20"/>
                </svg>
            </div>
            <h1>Joyería</h1>
            <p class="subtitle">Ingresa a tu cuenta para continuar</p>

            % if error:
            <div style="background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; border: 1px solid rgba(239, 68, 68, 0.3);">
                {{error}}
            </div>
            % end

            <form action="/login" method="post">
                <label>Correo electrónico</label>
                <div class="input-group">
                    <input type="email" name="usuario" placeholder="tu@email.com" required>
                </div>

                <label>Contraseña</label>
                <div class="input-group">
                    <input type="password" id="mi-password" name="password" placeholder="••••••••" required>
                    <button type="button" class="eye-icon-btn" id="btn-ojito" onclick="togglePassword('el-id-del-input', this)" title="Mostrar/Ocultar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <button type="submit" class="btn">
                    Iniciar Sesión
                </button>
            </form>

            <button type="button" class="link-btn" onclick="window.location.href='/registro'">
                 ¿No tienes cuenta? Regístrate aquí
            </button>
        </div>
    </div>

    <script>
        const botonOjito = document.getElementById('btn-ojito');
        const inputPassword = document.getElementById('mi-password');
        const svgOjo = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`;
        const svgOjoTachado = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;

        botonOjito.addEventListener('click', function() {
            if (inputPassword.type === 'password') {
                inputPassword.type = 'text';
                botonOjito.innerHTML = svgOjoTachado;
            } else {
                inputPassword.type = 'password';
                botonOjito.innerHTML = svgOjo;
            }
        });
    </script>
</body>
</html>
